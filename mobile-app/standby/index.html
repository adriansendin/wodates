<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Wodates</title>
    <link rel="icon" href="icon.png" type="image/png" />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          'Helvetica Neue', Arial, sans-serif;
        background: #ffffff;
        color: #1a1a1a;
        -webkit-font-smoothing: antialiased;
      }

      .page {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 32px;
        gap: 40px;
        text-align: center;
        max-width: 420px;
        margin: 0 auto;
      }

      .logo {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }

      .logo img {
        width: 80px;
        height: 80px;
        display: block;
      }

      .brand {
        font-size: 36px;
        font-weight: 700;
        color: #f45c5c;
        letter-spacing: -0.5px;
        line-height: 1.1;
      }

      .headline {
        font-size: 20px;
        font-weight: 700;
        color: #1a1a1a;
        line-height: 26px;
        margin: 0;
      }

      .message {
        font-size: 17px;
        font-weight: 400;
        color: #6b6b6b;
        line-height: 24px;
        margin: 0;
      }

      .contact {
        font-size: 17px;
        font-weight: 400;
        color: #6b6b6b;
        line-height: 24px;
        margin: 0;
      }

      .contact a {
        color: #f45c5c;
        font-weight: 600;
        text-decoration: none;
      }

      .contact a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <main class="page">
      <div class="logo">
        <img src="icon.png" width="80" height="80" alt="" />
        <div class="brand">Wodates</div>
      </div>

      <div>
        <p class="headline">Conecta por afinidad</p>
      </div>

      <div>
        <p class="message">
          Wodates está en pausa mientras preparamos la próxima etapa. Gracias por tu interés.
        </p>
        <p class="contact">
          Más información:
          <a href="mailto:adrian.sendin82@gmail.com">adrian.sendin82@gmail.com</a>
        </p>
      </div>
    </main>
  </body>
</html>
